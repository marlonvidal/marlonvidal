<svg xmlns="http://www.w3.org/2000/svg" width="840" height="156" viewBox="0 0 840 156" role="img" aria-label="15+ anos de desenvolvimento de software, 400+ líderes na comunidade Tech Managers, 500+ pessoas nas comunidades Cursor BH e POA">
<title>15+ anos de desenvolvimento de software, 400+ líderes na comunidade Tech Managers, 500+ pessoas nas comunidades Cursor BH e POA</title>
<style>
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.run{stroke-dasharray:9 91;animation:run 7s linear infinite}
@keyframes run{to{stroke-dashoffset:-100}}
.shine{animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,72%{transform:translateX(-420px)}100%{transform:translateX(1300px)}}
.ln{stroke-dasharray:100;stroke-dashoffset:100;animation:ln 1.4s ease forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.emo{font:22px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.ct{font:700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F1ECE3}
.cs{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A39A8A}
.cp{font:700 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.3px;fill:#C9B88A}
.cn{font:400 50px Georgia,'Times New Roman',serif;fill:url(#g)}
.cl{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFC6B6}
.cf{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8F8778}
.nn{font:400 46px Georgia,'Times New Roman',serif;fill:url(#g)}
.nl{font:500 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFC6B6}
.mk{font:400 20px Georgia,'Times New Roman',serif;fill:#C9B88A}
.mt{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F1ECE3}
.ms{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A39A8A}
.gt{font:700 13.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F1ECE3}
.pt{font:700 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F1ECE3}
.ps{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A39A8A}
.at{font:700 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F1ECE3}
.as{font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#A39A8A}
.ap{font:700 9.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1.2px;fill:#C9B88A}
.al{font:500 12.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#CFC6B6}
</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6D9B5"/><stop offset="1" stop-color="#8A7C58"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#F1E3C4" stop-opacity="0"/><stop offset=".5" stop-color="#F1E3C4" stop-opacity=".09"/><stop offset="1" stop-color="#F1E3C4" stop-opacity="0"/></linearGradient>
</defs>
<rect x="1" y="1" width="838" height="154" rx="18" fill="#151310" stroke="#2A2723"/>
<clipPath id="cn"><rect x="1" y="1" width="838" height="154" rx="18"/></clipPath>
<g clip-path="url(#cn)"><g class="shine"><rect x="0" y="-20" width="150" height="196" fill="url(#sh)" transform="skewX(-18)"/></g></g>
<rect class="run" x="1" y="1" width="838" height="154" rx="18" fill="none" stroke="url(#g)" stroke-width="1.6" pathLength="100"/>
<g transform="translate(0,74)"><g class="up" style="animation-delay:0.15s"><text class="nn" x="140.0" y="0" text-anchor="middle">15+</text></g><g class="up" style="animation-delay:0.35s"><text class="nl" x="140.0" y="30" text-anchor="middle">anos de desenvolvimento</text><text class="nl" x="140.0" y="49" text-anchor="middle">de software</text></g></g>
<g transform="translate(0,74)"><g class="up" style="animation-delay:0.33s"><text class="nn" x="420.0" y="0" text-anchor="middle">400+</text></g><g class="up" style="animation-delay:0.53s"><text class="nl" x="420.0" y="30" text-anchor="middle">líderes na comunidade</text><text class="nl" x="420.0" y="49" text-anchor="middle">Tech Managers</text></g></g>
<line class="ln" x1="280.0" y1="34" x2="280.0" y2="122" stroke="#2A2723" pathLength="100" style="animation-delay:0.33s"/>
<g transform="translate(0,74)"><g class="up" style="animation-delay:0.51s"><text class="nn" x="700.0" y="0" text-anchor="middle">500+</text></g><g class="up" style="animation-delay:0.71s"><text class="nl" x="700.0" y="30" text-anchor="middle">pessoas nas comunidades</text><text class="nl" x="700.0" y="49" text-anchor="middle">Cursor BH e POA</text></g></g>
<line class="ln" x1="560.0" y1="34" x2="560.0" y2="122" stroke="#2A2723" pathLength="100" style="animation-delay:0.51s"/>
</svg>
